openapi: 3.0.3
info:
  title: XA Bank Time Deposit API
  version: 1.0.0
  description: Lists time deposits and applies monthly interest to their balances.
servers:
  - url: http://localhost:8080
tags:
  - name: TimeDeposits
    description: Time deposit operations

paths:
  /time-deposits:
    get:
      tags: [TimeDeposits]
      operationId: getAllTimeDeposits
      summary: Get all time deposits with their withdrawals
      responses:
        '200':
          description: All time deposits, ordered by id
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TimeDeposit'

  /time-deposits/balance-updates:
    post:
      tags: [TimeDeposits]
      operationId: updateAllBalances
      summary: Apply one month of interest to every time deposit
      description: >
        Adds one month of interest to the balance of every time deposit, based on its plan type.
        Not idempotent - every call adds another month of interest.
      responses:
        '204':
          description: Balances updated

components:
  schemas:
    TimeDeposit:
      type: object
      additionalProperties: false
      required: [id, planType, balance, days, withdrawals]
      properties:
        id:
          type: integer
          format: int32
          example: 1
        planType:
          type: string
          description: Known plan types are basic, student and premium.
          example: basic
        balance:
          type: number
          description: Current balance with two decimal places.
          example: 10008.33
        days:
          type: integer
          format: int32
          description: Age of the deposit in days.
          example: 45
        withdrawals:
          type: array
          items:
            $ref: '#/components/schemas/Withdrawal'

    Withdrawal:
      type: object
      additionalProperties: false
      required: [id, amount, date]
      properties:
        id:
          type: integer
          format: int32
          example: 1
        amount:
          type: number
          example: 500.00
        date:
          type: string
          format: date
          example: '2026-09-15'